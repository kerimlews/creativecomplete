      <stop offset="0%" stop-color="#2d1b69"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <rect width="100" height="110" fill="url(#bg)"/>
  <!-- Suit jacket -->
  <path d="M0 110 Q0 68 26 62 L50 70 L74 62 Q100 68 100 110Z" fill="#3b0764"/>
  <!-- Suit lapels -->
  <path d="M33 68 L50 80 L67 68 L74 62 L50 70 L26 62Z" fill="#4c1d95"/>
