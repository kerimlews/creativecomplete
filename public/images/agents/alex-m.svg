  <path d="M49 36 L49 41" stroke="#a06030" stroke-width="0.8" fill="none" opacity="0.3"/>
  <!-- Nose base -->
  <path d="M46 42 Q50 45 54 42" stroke="#a06030" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.45"/>
  <!-- Mouth slight smirk -->
  <path d="M44.5 50 Q50 54 57 50" stroke="#b06840" stroke-width="1.8" fill="none" stroke-linecap="round"/>
