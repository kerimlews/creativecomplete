  <ellipse cx="50" cy="38" rx="18" ry="20.5" fill="#D4956A"/>
  <!-- Jaw hint -->
  <ellipse cx="50" cy="53" rx="14" ry="7" fill="#D4956A"/>
  <!-- Eyebrows straight/strong -->
  <path d="M39.5 30 L47 29" stroke="#0d0d0d" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M53 29 L60.5 30" stroke="#0d0d0d" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Eyes -->
  <ellipse cx="44" cy="34.5" rx="3.5" ry="3" fill="#0d0d0d"/>
  <ellipse cx="56" cy="34.5" rx="3.5" ry="3" fill="#0d0d0d"/>
  <!-- Iris -->
  <circle cx="44" cy="34.5" r="2" fill="#3d2010"/>
  <circle cx="56" cy="34.5" r="2" fill="#3d2010"/>
  <!-- Pupil -->
  <circle cx="44" cy="34.5" r="1.1" fill="#050505"/>
  <circle cx="56" cy="34.5" r="1.1" fill="#050505"/>
  <!-- Eye shine -->
  <circle cx="45.2" cy="33.4" r="0.9" fill="white" opacity="0.9"/>
  <circle cx="57.2" cy="33.4" r="0.9" fill="white" opacity="0.9"/>
