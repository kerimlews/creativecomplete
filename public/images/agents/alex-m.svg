  <rect x="44" y="54" width="12" height="16" rx="5" fill="#D4956A"/>
  <!-- Hair short crop -->
  <ellipse cx="50" cy="32" rx="20.5" ry="18.5" fill="#1a1a1a"/>
  <!-- Hairline fade -->
  <path d="M30 36 Q29 48 34 53 Q36 47 33 36Z" fill="#1a1a1a"/>
  <path d="M70 36 Q71 48 66 53 Q64 47 67 36Z" fill="#1a1a1a"/>
