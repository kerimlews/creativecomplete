<svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>
  <rect width="100" height="110" fill="url(#bg)"/>
  <!-- Blouse -->
  <path d="M0 110 Q0 70 28 64 L50 70 L72 64 Q100 70 100 110Z" fill="#d97706"/>
  <!-- Collar V-neck -->
  <path d="M43 66 L50 73 L57 66" stroke="#fbbf24" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="44" y="54" width="12" height="16" rx="5" fill="#EEBF8A"/>
  <!-- Hair long auburn (back layer) -->
  <ellipse cx="50" cy="33" rx="24.5" ry="27.5" fill="#7C2D00"/>
  <!-- Hair sides long flowing -->
  <path d="M25.5 33 Q22 50 25 70 Q29 62 27 33Z" fill="#7C2D00"/>
  <path d="M74.5 33 Q78 50 75 70 Q71 62 73 33Z" fill="#7C2D00"/>
  <!-- Hair wave texture -->
  <path d="M25 50 Q23 60 26 68 Q29 60 27 50Z" fill="#6b2500" opacity="0.6"/>
  <path d="M75 50 Q77 60 74 68 Q71 60 73 50Z" fill="#6b2500" opacity="0.6"/>
  <!-- Face -->
  <ellipse cx="50" cy="36" rx="18.5" ry="20.5" fill="#EEBF8A"/>
  <!-- Jaw -->
  <ellipse cx="50" cy="51" rx="12.5" ry="7" fill="#EEBF8A"/>
  <!-- Eyebrows arched feminine -->
  <path d="M40 27.5 Q44 25 47.5 27" stroke="#5C2D0A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M52.5 27 Q56 25 60 27.5" stroke="#5C2D0A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Eyes (slightly wider/more open) -->
  <ellipse cx="44" cy="32.5" rx="4" ry="3.2" fill="#2d1200"/>
  <ellipse cx="56" cy="32.5" rx="4" ry="3.2" fill="#2d1200"/>
  <!-- Iris amber-brown -->
  <circle cx="44" cy="32.5" r="2.2" fill="#8B4510"/>
  <circle cx="56" cy="32.5" r="2.2" fill="#8B4510"/>
  <!-- Pupil -->
  <circle cx="44" cy="32.5" r="1.2" fill="#080300"/>
  <circle cx="56" cy="32.5" r="1.2" fill="#080300"/>
  <!-- Eye shine -->
  <circle cx="45.3" cy="31.3" r="1" fill="white" opacity="0.95"/>
  <circle cx="57.3" cy="31.3" r="1" fill="white" opacity="0.95"/>
  <!-- Eyelash hint -->
  <path d="M40 29 Q44 28.5 47.5 29.5" stroke="#2d1200" stroke-width="0.8" fill="none" opacity="0.5"/>
  <path d="M52.5 29.5 Q56 28.5 60 29" stroke="#2d1200" stroke-width="0.8" fill="none" opacity="0.5"/>
  <!-- Nose delicate -->
  <path d="M48 38.5 Q50 42 52 38.5" stroke="#c08060" stroke-width="1.1" fill="none" stroke-linecap="round" opacity="0.4"/>
  <!-- Lips fuller -->
  <path d="M44.5 46 Q47 43.5 50 44 Q53 43.5 55.5 46" fill="#d4705a" opacity="0.7"/>
  <path d="M44 46.5 Q50 51 56 46.5" stroke="#c0604a" stroke-width="1.9" fill="none" stroke-linecap="round"/>
  <!-- Blush warm -->
  <circle cx="37" cy="39" r="6.5" fill="#ffb0a0" opacity="0.2"/>
  <circle cx="63" cy="39" r="6.5" fill="#ffb0a0" opacity="0.2"/>
</svg>
