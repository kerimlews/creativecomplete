<svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>
  <rect width="100" height="110" fill="url(#bg)"/>
  <!-- Shirt -->
  <path d="M0 110 Q0 72 30 66 L50 72 L70 66 Q100 72 100 110Z" fill="#4f46e5"/>
  <!-- Collar open -->
  <path d="M44 68 L50 74 L56 68 L54 66 L50 70 L46 66Z" fill="#7c78f0" opacity="0.5"/>
  <!-- Neck -->
  <rect x="44" y="54" width="12" height="16" rx="5" fill="#FCDDB4"/>
  <!-- Hair back (long, dark) -->
  <ellipse cx="50" cy="35" rx="23" ry="26" fill="#1A0800"/>
  <rect x="27" y="35" width="9" height="32" rx="4" fill="#1A0800"/>
  <rect x="64" y="35" width="9" height="32" rx="4" fill="#1A0800"/>
  <!-- Face -->
  <ellipse cx="50" cy="37" rx="18.5" ry="20" fill="#FCDDB4"/>
  <!-- Subtle jaw shape -->
  <ellipse cx="50" cy="51" rx="13" ry="7" fill="#FCDDB4"/>
  <!-- Eyebrows -->
  <path d="M40 28.5 Q44 26.5 47.5 28.5" stroke="#2d1500" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M52.5 28.5 Q56 26.5 60 28.5" stroke="#2d1500" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Eyes -->
  <ellipse cx="44" cy="33" rx="3.8" ry="3" fill="#2d1500"/>
  <ellipse cx="56" cy="33" rx="3.8" ry="3" fill="#2d1500"/>
  <!-- Iris -->
  <circle cx="44" cy="33" r="2" fill="#6b3a1f"/>
  <circle cx="56" cy="33" r="2" fill="#6b3a1f"/>
  <!-- Pupil -->
  <circle cx="44" cy="33" r="1.2" fill="#0a0500"/>
  <circle cx="56" cy="33" r="1.2" fill="#0a0500"/>
  <!-- Eye shine -->
  <circle cx="45.2" cy="32" r="0.9" fill="white" opacity="0.95"/>
  <circle cx="57.2" cy="32" r="0.9" fill="white" opacity="0.95"/>
  <!-- Eyelashes hint -->
  <path d="M40 30 Q44 29.5 47.5 30.5" stroke="#1a0800" stroke-width="0.8" fill="none" opacity="0.6"/>
  <path d="M52.5 30.5 Q56 29.5 60 30" stroke="#1a0800" stroke-width="0.8" fill="none" opacity="0.6"/>
  <!-- Nose -->
  <path d="M48 40 Q50 43.5 52 40" stroke="#c4885a" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.45"/>
  <!-- Lips -->
  <path d="M44.5 47.5 Q50 50 55.5 47.5" stroke="#c97b5c" stroke-width="1" fill="none"/>
  <path d="M44.5 47.5 Q50 52 55.5 47.5" stroke="#c97b5c" stroke-width="1.9" fill="none" stroke-linecap="round"/>
  <path d="M44.5 47.5 Q50 49.5 55.5 47.5" fill="#d4896a" opacity="0.3"/>
  <!-- Blush -->
  <circle cx="37" cy="40" r="6" fill="#ff9980" opacity="0.18"/>
  <circle cx="63" cy="40" r="6" fill="#ff9980" opacity="0.18"/>
</svg>
