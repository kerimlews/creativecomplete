  </defs>

  <rect width="800" height="420" fill="url(#bg)"/>

  <text x="400" y="36" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" letter-spacing="0.18em" fill="#6366f1" font-weight="600">03 — MULTI-PLATFORM FORMAT EXPORT</text>

  <!-- Source creative center -->
  <rect x="316" y="60" width="168" height="168" rx="12" fill="rgba(99,102,241,0.1)" stroke="rgba(99,102,241,0.4)" stroke-width="1.5"/>
