  <path d="M 316 144 L 152 282" stroke="rgba(99,102,241,0.3)" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <path d="M 400 228 L 400 286" stroke="rgba(99,102,241,0.4)" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 484 140 L 590 180" stroke="rgba(99,102,241,0.4)" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 484 144 L 648 282" stroke="rgba(99,102,241,0.3)" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- Format 1: Instagram Story (portrait) -->
  <rect x="94" y="164" width="92" height="152" rx="10" fill="rgba(168,85,247,0.08)" stroke="rgba(168,85,247,0.25)" stroke-width="1"/>
  <rect x="102" y="174" width="76" height="118" rx="6" fill="rgba(168,85,247,0.12)"/>
