  <rect x="308" y="302" width="184" height="82" rx="6" fill="rgba(99,102,241,0.12)"/>
  <text x="400" y="424" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" font-weight="500">Facebook Feed</text>

  <!-- Format 3 label inside -->
  <text x="400" y="382" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="rgba(99,102,241,0.5)" letter-spacing="0.06em">1200×628</text>

  <!-- Format 4: Reels / TikTok (portrait tall) -->
  <rect x="614" y="164" width="92" height="152" rx="10" fill="rgba(245,158,11,0.06)" stroke="rgba(245,158,11,0.2)" stroke-width="1"/>
  <rect x="622" y="174" width="76" height="118" rx="6" fill="rgba(245,158,11,0.1)"/>
  <text x="660" y="310" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" font-weight="500">Reels / TikTok</text>
  <text x="660" y="326" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="rgba(245,158,11,0.5)" letter-spacing="0.06em">1080×1920</text>

  <!-- Format 5: Google Square -->
  <rect x="576" y="290" width="180" height="68" rx="10" fill="rgba(34,197,94,0.06)" stroke="rgba(34,197,94,0.18)" stroke-width="1"/>
  <rect x="588" y="300" width="156" height="46" rx="6" fill="rgba(34,197,94,0.08)"/>
  <text x="666" y="372" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" font-weight="500">Google Square</text>
  <text x="666" y="386" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="rgba(34,197,94,0.5)" letter-spacing="0.06em">300×250</text>

  <text x="400" y="408" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.3)">One creative · Every platform size · Perfect crop every time</text>
