<svg width="800" height="420" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0f1f"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="bar-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="60%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="420" fill="url(#bg)"/>
  <rect width="800" height="420" fill="url(#glow)"/>

  <text x="400" y="36" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" letter-spacing="0.18em" fill="#a855f7" font-weight="600">01 — PERFORMANCE SCORING</text>

  <!-- Manual creative: left -->
  <rect x="44" y="60" width="300" height="310" rx="14" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="194" y="92" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="rgba(255,255,255,0.2)" letter-spacing="0.14em">WITHOUT AI SCORING</text>
  <!-- Mock creative preview -->
  <rect x="68" y="108" width="252" height="142" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="80" y="120" width="120" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>
  <rect x="80" y="136" width="80" height="6" rx="3" fill="rgba(255,255,255,0.05)"/>
  <rect x="80" y="162" width="228" height="60" rx="6" fill="rgba(255,255,255,0.04)"/>
  <rect x="80" y="232" width="68" height="10" rx="5" fill="rgba(255,255,255,0.06)"/>
  <!-- No score -->
  <rect x="68" y="268" width="252" height="44" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="194" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.2)">No performance data</text>
  <text x="194" y="302" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.15)">Launch and hope</text>
  <!-- Result: wasted spend -->
  <rect x="68" y="326" width="252" height="28" rx="8" fill="rgba(239,68,68,0.06)" stroke="rgba(239,68,68,0.15)" stroke-width="1"/>
  <text x="194" y="344" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="rgba(239,68,68,0.5)" letter-spacing="0.1em">WASTED AD SPEND ↑</text>

  <!-- AI creative: right -->
  <rect x="456" y="60" width="300" height="310" rx="14" fill="rgba(168,85,247,0.06)" stroke="rgba(168,85,247,0.3)" stroke-width="1.5"/>
  <text x="606" y="92" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#d8b4fe" letter-spacing="0.14em">WITH AI SCORING</text>
  <!-- Mock creative preview (same) -->
  <rect x="480" y="108" width="252" height="142" rx="8" fill="rgba(168,85,247,0.07)" stroke="rgba(168,85,247,0.15)" stroke-width="1"/>
  <rect x="492" y="120" width="120" height="8" rx="4" fill="rgba(168,85,247,0.2)"/>
  <rect x="492" y="136" width="80" height="6" rx="3" fill="rgba(168,85,247,0.12)"/>
  <rect x="492" y="162" width="228" height="60" rx="6" fill="rgba(168,85,247,0.1)"/>
  <rect x="492" y="232" width="68" height="10" rx="5" fill="rgba(168,85,247,0.15)"/>
