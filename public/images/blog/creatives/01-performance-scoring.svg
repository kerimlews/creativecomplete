  <text x="606" y="288" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">Predicted performance</text>
  <!-- Score bars -->
  <text x="492" y="308" font-family="ui-monospace,monospace" font-size="9" fill="rgba(255,255,255,0.3)" letter-spacing="0.06em">CTR</text>
  <rect x="516" y="300" width="160" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
  <rect x="516" y="300" width="138" height="6" rx="3" fill="url(#bar-fill)"/>
  <text x="688" y="308" font-family="ui-monospace,monospace" font-size="9" fill="#d8b4fe" font-weight="700">94</text>
  <text x="492" y="326" font-family="ui-monospace,monospace" font-size="9" fill="rgba(255,255,255,0.3)" letter-spacing="0.06em">CVR</text>
  <rect x="516" y="318" width="160" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
  <rect x="516" y="318" width="120" height="6" rx="3" fill="url(#bar-fill)" opacity="0.7"/>
  <text x="688" y="326" font-family="ui-monospace,monospace" font-size="9" fill="#d8b4fe" font-weight="700">75</text>
  <!-- Result: good -->
  <rect x="480" y="354" width="252" height="28" rx="8" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
  <text x="606" y="372" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#4ade80" letter-spacing="0.1em" font-weight="700">ONLY TOP CREATIVES LAUNCH ✓</text>

  <!-- VS divider -->
  <text x="400" y="222" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="rgba(255,255,255,0.15)">VS</text>
  <line x1="400" y1="80" x2="400" y2="370" stroke="rgba(255,255,255,0.05)" stroke-width="1" stroke-dasharray="5,4"/>

  <text x="400" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.3)">Only publish creatives predicted to convert · Stop guessing, start knowing</text>
</svg>
