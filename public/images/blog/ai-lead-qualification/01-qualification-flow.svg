<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="flowg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>

  <text x="400" y="40" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#6366f1" letter-spacing="3" opacity="0.7">AI LEAD QUALIFICATION FLOW</text>

  <!-- Step boxes -->
  <!-- 1: Inbound lead -->
  <rect x="40" y="130" width="140" height="160" rx="14" fill="rgba(99,102,241,0.06)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
  <text x="110" y="162" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#6366f1" letter-spacing="2">INBOUND</text>
  <text x="110" y="184" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="rgba(255,255,255,0.85)">Lead</text>
  <text x="110" y="200" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="rgba(255,255,255,0.85)">Arrives</text>
  <line x1="80" y1="224" x2="140" y2="224" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="110" y="242" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.3)">Any channel</text>
  <text x="110" y="256" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="rgba(255,255,255,0.2)">24/7 · 365 days</text>
  <text x="110" y="276" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#6366f1" opacity="0.5">&lt; 5s trigger</text>

  <!-- Arrow 1 -->
  <line x1="180" y1="210" x2="220" y2="210" stroke="url(#flowg)" stroke-width="1.5" opacity="0.6"/>
  <polygon points="220,205 232,210 220,215" fill="#818cf8" opacity="0.8"/>

  <!-- 2: AI Conversation -->
  <rect x="232" y="100" width="150" height="220" rx="14" fill="rgba(168,85,247,0.08)" stroke="rgba(168,85,247,0.4)" stroke-width="1.5"/>
  <text x="307" y="126" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#a855f7" letter-spacing="2">AI AGENT</text>
  <text x="307" y="148" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#ede9fe">Qualification</text>
  <text x="307" y="164" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#ede9fe">Conversation</text>

  <rect x="248" y="178" width="118" height="24" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="307" y="195" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">💰 Budget range?</text>

  <rect x="248" y="208" width="118" height="24" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="307" y="225" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">👤 Decision-maker?</text>

  <rect x="248" y="238" width="118" height="24" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="307" y="255" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">🎯 Specific need?</text>

  <rect x="248" y="268" width="118" height="24" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="307" y="285" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">📅 Timeline?</text>

  <text x="307" y="308" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#a855f7" opacity="0.6">3–7 min exchange</text>

  <!-- Arrow 2 -->
  <line x1="382" y1="210" x2="422" y2="210" stroke="url(#flowg)" stroke-width="1.5" opacity="0.6"/>
  <polygon points="422,205 434,210 422,215" fill="#06b6d4" opacity="0.8"/>

  <!-- 3: Scoring -->
  <rect x="434" y="130" width="130" height="160" rx="14" fill="rgba(34,211,238,0.06)" stroke="rgba(34,211,238,0.3)" stroke-width="1"/>
  <text x="499" y="162" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#22d3ee" letter-spacing="2">SCORE</text>
  <text x="499" y="200" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="36" font-weight="800" fill="#67e8f9">87</text>
  <text x="499" y="220" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="rgba(255,255,255,0.3)">/100 BANT</text>
  <rect x="454" y="234" width="90" height="14" rx="4" fill="rgba(34,211,238,0.15)"/>
  <rect x="454" y="234" width="78" height="14" rx="4" fill="rgba(34,211,238,0.4)"/>
  <text x="499" y="264" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#f97316" font-weight="700">🔥 HOT</text>
  <text x="499" y="278" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="rgba(255,255,255,0.3)">Route now</text>

  <!-- Arrow 3 -->
  <line x1="564" y1="210" x2="604" y2="210" stroke="url(#flowg)" stroke-width="1.5" opacity="0.6"/>
  <polygon points="604,205 616,210 604,215" fill="#22d3ee" opacity="0.8"/>

  <!-- 4: Routing outcome -->
  <rect x="616" y="90" width="150" height="240" rx="14" fill="rgba(34,211,238,0.04)" stroke="rgba(34,211,238,0.2)" stroke-width="1"/>
  <text x="691" y="118" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#22d3ee" letter-spacing="2">OUTCOME</text>

  <!-- Hot route -->
  <rect x="630" y="130" width="122" height="44" rx="8" fill="rgba(249,115,22,0.1)" stroke="rgba(249,115,22,0.35)" stroke-width="1"/>
  <text x="691" y="150" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#f97316" font-weight="700">HOT 80–100</text>
  <text x="691" y="166" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">→ Sales rep now</text>

  <!-- Warm route -->
  <rect x="630" y="182" width="122" height="44" rx="8" fill="rgba(99,102,241,0.08)" stroke="rgba(99,102,241,0.25)" stroke-width="1"/>
  <text x="691" y="202" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#818cf8" font-weight="700">WARM 60–79</text>
  <text x="691" y="218" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">→ Contact 2h</text>

  <!-- Nurture -->
  <rect x="630" y="234" width="122" height="44" rx="8" fill="rgba(168,85,247,0.06)" stroke="rgba(168,85,247,0.2)" stroke-width="1"/>
  <text x="691" y="254" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#c084fc" font-weight="700">NURTURE 40–59</text>
  <text x="691" y="270" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.35)">→ Sequence</text>

  <!-- Not fit -->
  <rect x="630" y="286" width="122" height="32" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="691" y="306" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="rgba(255,255,255,0.25)">NOT FIT 0–39</text>

  <!-- Bottom note -->
  <text x="400" y="392" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="rgba(255,255,255,0.18)">Every lead scored before a human gets involved — 24 hours a day, 7 days a week</text>
</svg>
