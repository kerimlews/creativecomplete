<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="wag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#25d166"/>
      <stop offset="100%" stop-color="#128c3e"/>
    </linearGradient>
    <linearGradient id="emailg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="smsg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>

  <text x="400" y="40" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#25d166" letter-spacing="3" opacity="0.8">CHANNEL PERFORMANCE COMPARISON</text>

  <!-- Metric labels -->
  <text x="130" y="82" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="rgba(255,255,255,0.4)">OPEN RATE</text>
  <text x="340" y="82" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="rgba(255,255,255,0.4)">RESPONSE RATE</text>
  <text x="560" y="82" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="rgba(255,255,255,0.4)">CONVERSION</text>
  <text x="720" y="82" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="rgba(255,255,255,0.4)">READ TIME</text>

  <!-- WhatsApp row -->
  <rect x="24" y="100" width="752" height="72" rx="12" fill="rgba(37,209,102,0.08)" stroke="rgba(37,209,102,0.35)" stroke-width="1.5"/>
  <text x="24" y="96" font-family="ui-monospace,monospace" font-size="9" fill="#25d166" letter-spacing="2" font-weight="700">▶ WHATSAPP</text>

  <!-- WA open rate bar -->
  <rect x="60" y="116" width="140" height="16" rx="4" fill="rgba(255,255,255,0.05)"/>
  <rect x="60" y="116" width="137" height="16" rx="4" fill="url(#wag)" opacity="0.9"/>
  <text x="130" y="150" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="18" font-weight="800" fill="#25d166">98%</text>

  <!-- WA response rate bar -->
  <rect x="270" y="116" width="140" height="16" rx="4" fill="rgba(255,255,255,0.05)"/>
  <rect x="270" y="116" width="63" height="16" rx="4" fill="url(#wag)" opacity="0.9"/>
  <text x="340" y="150" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="18" font-weight="800" fill="#25d166">45%</text>

  <!-- WA conversion -->
  <rect x="490" y="116" width="140" height="16" rx="4" fill="rgba(255,255,255,0.05)"/>
  <rect x="490" y="116" width="70" height="16" rx="4" fill="url(#wag)" opacity="0.9"/>
  <text x="560" y="150" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="18" font-weight="800" fill="#25d166">~12%</text>

  <!-- WA read time -->
  <text x="720" y="142" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="18" font-weight="800" fill="#25d166">3 min</text>

  <!-- Email row -->
  <rect x="24" y="186" width="752" height="72" rx="12" fill="rgba(99,102,241,0.05)" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>
  <text x="60" y="205" font-family="ui-monospace,monospace" font-size="9" fill="#818cf8" letter-spacing="2">EMAIL</text>

  <rect x="60" y="210" width="140" height="10" rx="3" fill="rgba(255,255,255,0.04)"/>
  <rect x="60" y="210" width="25" height="10" rx="3" fill="url(#emailg)" opacity="0.7"/>
  <text x="130" y="236" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="16" font-weight="600" fill="#818cf8">18%</text>

  <rect x="270" y="210" width="140" height="10" rx="3" fill="rgba(255,255,255,0.04)"/>
  <rect x="270" y="210" width="8" height="10" rx="3" fill="url(#emailg)" opacity="0.7"/>
  <text x="340" y="236" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="16" font-weight="600" fill="#818cf8">6%</text>

  <rect x="490" y="210" width="140" height="10" rx="3" fill="rgba(255,255,255,0.04)"/>
  <rect x="490" y="210" width="4" height="10" rx="3" fill="url(#emailg)" opacity="0.7"/>
  <text x="560" y="236" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="16" font-weight="600" fill="#818cf8">~2%</text>

  <text x="720" y="234" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="16" font-weight="600" fill="#818cf8">2 days</text>

  <!-- SMS row -->
  <rect x="24" y="270" width="752" height="72" rx="12" fill="rgba(249,115,22,0.04)" stroke="rgba(249,115,22,0.15)" stroke-width="1"/>
  <text x="60" y="289" font-family="ui-monospace,monospace" font-size="9" fill="#f97316" letter-spacing="2">SMS</text>

  <rect x="60" y="294" width="140" height="10" rx="3" fill="rgba(255,255,255,0.04)"/>
  <rect x="60" y="294" width="96" height="10" rx="3" fill="url(#smsg)" opacity="0.6"/>
  <text x="130" y="320" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="16" font-weight="600" fill="#f97316">68%</text>

  <rect x="270" y="294" width="140" height="10" rx="3" fill="rgba(255,255,255,0.04)"/>
  <rect x="270" y="294" width="21" height="10" rx="3" fill="url(#smsg)" opacity="0.6"/>
  <text x="340" y="320" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="16" font-weight="600" fill="#f97316">15%</text>

  <rect x="490" y="294" width="140" height="10" rx="3" fill="rgba(255,255,255,0.04)"/>
  <rect x="490" y="294" width="7" height="10" rx="3" fill="url(#smsg)" opacity="0.6"/>
  <text x="560" y="320" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="16" font-weight="600" fill="#f97316">~5%</text>

  <text x="720" y="318" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="16" font-weight="600" fill="#f97316">3 min</text>

  <text x="400" y="392" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="rgba(255,255,255,0.18)">WhatsApp delivers 5× higher engagement than email at the same cost</text>
</svg>
