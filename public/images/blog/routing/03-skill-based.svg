  <text x="476" y="254" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#4ade80">✓</text>
  <rect x="320" y="328" width="100" height="18" rx="9" fill="rgba(168,85,247,0.15)" stroke="rgba(168,85,247,0.3)" stroke-width="1"/>
  <text x="370" y="341" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="#d8b4fe" letter-spacing="0.12em" font-weight="700">MATCHED ✓</text>

