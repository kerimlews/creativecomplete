  <text x="400" y="36" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" letter-spacing="0.18em" fill="#a855f7" font-weight="600">03 — SKILL-BASED ROUTING</text>

  <!-- Lead card with skill tag -->
  <rect x="270" y="58" width="260" height="80" rx="12" fill="rgba(168,85,247,0.08)" stroke="rgba(168,85,247,0.3)" stroke-width="1.5"/>
