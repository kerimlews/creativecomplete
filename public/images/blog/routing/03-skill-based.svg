  <text x="740" y="253" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="rgba(239,68,68,0.5)">✕</text>
  <text x="670" y="346" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.2)">No match</text>

