  <rect x="64" y="172" width="160" height="72" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="96" cy="202" r="16" fill="rgba(99,102,241,0.15)"/>
  <text x="96" y="208" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="rgba(255,255,255,0.7)" font-weight="600">DM</text>
  <text x="118" y="198" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.75)">Dan M.</text>
  <text x="118" y="214" font-family="ui-monospace,monospace" font-size="10" fill="#a5b4fc">12 leads</text>
  <rect x="74" y="226" width="60" height="10" rx="5" fill="rgba(99,102,241,0.15)"/>
  <rect x="74" y="226" width="60" height="10" rx="5" fill="rgba(99,102,241,0.4)"/>

  <!-- Equal label -->
  <text x="400" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.35)">Every agent gets equal volume · No burnout · No favoritism</text>
