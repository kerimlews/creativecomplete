<svg width="800" height="420" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0f1f"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="glow-sales" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22c55e" opacity="0.8"/>
    </marker>
    <marker id="arr-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="rgba(255,255,255,0.1)"/>
    </marker>
  </defs>

  <rect width="800" height="420" fill="url(#bg)"/>

  <!-- Eyebrow -->
  <text x="400" y="36" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" letter-spacing="0.18em" fill="#22c55e" font-weight="600">07 — FUNCTION-BASED ROUTING</text>

  <!-- Incoming lead top center -->
  <rect x="296" y="56" width="208" height="68" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <circle cx="324" cy="84" r="5" fill="#22d3ee"/>
  <text x="340" y="81" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.85)">Incoming Lead</text>
  <text x="340" y="97" font-family="system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.45)">"I want to upgrade my plan"</text>
  <rect x="308" y="108" width="96" height="10" rx="5" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.25)" stroke-width="1"/>
  <text x="356" y="117" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7.5" fill="#4ade80" letter-spacing="0.1em">SALES INTENT</text>

  <!-- Branch lines: left (support), center (sales), right (AM) -->
  <path d="M 340 124 L 160 228" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arr-d)"/>
  <path d="M 400 124 L 400 224" stroke="#22c55e" stroke-width="2" stroke-opacity="0.7" marker-end="url(#arr-g)"/>
  <path d="M 460 124 L 640 228" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arr-d)"/>

  <!-- Support card (no match) -->
  <rect x="40" y="230" width="240" height="130" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="160" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="30">🔧</text>
  <text x="160" y="298" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="rgba(255,255,255,0.28)">Support</text>
  <text x="160" y="316" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.18)">Bug fixes · Technical help</text>
  <!-- X -->
  <circle cx="260" cy="246" r="14" fill="rgba(239,68,68,0.08)" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
  <text x="260" y="252" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="rgba(239,68,68,0.5)">✕</text>
  <text x="160" y="348" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="rgba(255,255,255,0.15)" letter-spacing="0.1em">NO MATCH</text>

  <!-- Sales card (MATCH) -->
  <rect x="280" y="226" width="240" height="150" rx="12" fill="rgba(34,197,94,0.08)" stroke="rgba(34,197,94,0.4)" stroke-width="1.5"/>
  <rect x="280" y="226" width="240" height="150" rx="12" fill="url(#glow-sales)"/>
  <text x="400" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="30">💰</text>
  <text x="400" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.9)">Sales</text>
  <text x="400" y="320" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Upgrades · New deals · Pricing</text>
  <!-- Check -->
  <circle cx="500" cy="242" r="15" fill="rgba(34,197,94,0.18)" stroke="rgba(34,197,94,0.45)" stroke-width="1.5"/>
  <text x="500" y="248" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#4ade80">✓</text>
  <rect x="308" y="336" width="184" height="20" rx="10" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.35)" stroke-width="1"/>
  <text x="400" y="350" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#4ade80" letter-spacing="0.1em" font-weight="700">MATCHED — ROUTED ✓</text>

  <!-- Account Mgt card (no match) -->
  <rect x="520" y="230" width="240" height="130" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="640" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="30">👤</text>
  <text x="640" y="298" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="rgba(255,255,255,0.28)">Account Mgmt</text>
  <text x="640" y="316" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.18)">Renewals · Relationship</text>
  <!-- X -->
  <circle cx="540" cy="246" r="14" fill="rgba(239,68,68,0.08)" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
  <text x="540" y="252" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="rgba(239,68,68,0.5)">✕</text>
  <text x="640" y="348" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="rgba(255,255,255,0.15)" letter-spacing="0.1em">NO MATCH</text>

  <!-- Result -->
  <text x="400" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.35)">Zero wrong-department routing · Faster resolution · Fewer internal transfers</text>
</svg>
