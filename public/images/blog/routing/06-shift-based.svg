  <text x="580" y="304" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22">💼</text>
  <text x="580" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="rgba(255,255,255,0.88)" font-weight="600">Day Team</text>
