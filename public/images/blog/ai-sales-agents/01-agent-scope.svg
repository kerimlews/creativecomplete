<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <radialGradient id="aglow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>

  <text x="400" y="38" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#6366f1" letter-spacing="3" opacity="0.7">AI SALES AGENT — SCOPE OF WORK</text>

  <!-- Center: AI Agent -->
  <ellipse cx="400" cy="215" rx="130" ry="70" fill="url(#aglow)"/>
  <rect x="330" y="175" width="140" height="80" rx="16" fill="rgba(99,102,241,0.12)" stroke="rgba(99,102,241,0.5)" stroke-width="2"/>
  <text x="400" y="207" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#818cf8" letter-spacing="2">✨ AI</text>
  <text x="400" y="227" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="#e0e7ff">Sales Agent</text>
  <text x="400" y="244" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="rgba(255,255,255,0.3)">24/7 · Any language</text>

  <!-- Surrounding tasks -->
  <!-- First response (top) -->
  <rect x="290" y="50" width="220" height="52" rx="10" fill="rgba(99,102,241,0.08)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
  <text x="400" y="74" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="rgba(255,255,255,0.85)">First Response &lt;60s</text>
  <text x="400" y="90" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">Personalized to source &amp; need</text>
  <line x1="400" y1="102" x2="400" y2="175" stroke="#6366f1" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <polygon points="396,172 400,178 404,172" fill="#6366f1" opacity="0.5"/>

  <!-- BANT qualification (right) -->
  <rect x="570" y="150" width="200" height="52" rx="10" fill="rgba(168,85,247,0.07)" stroke="rgba(168,85,247,0.25)" stroke-width="1"/>
  <text x="670" y="174" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="rgba(255,255,255,0.85)">BANT Qualification</text>
  <text x="670" y="190" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">Budget · Auth · Need · Timeline</text>
  <line x1="570" y1="176" x2="470" y2="204" stroke="#a855f7" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <polygon points="472,199 468,207 476,207" fill="#a855f7" opacity="0.5"/>

  <!-- Follow-up sequences (bottom-right) -->
  <rect x="530" y="270" width="220" height="52" rx="10" fill="rgba(34,211,238,0.06)" stroke="rgba(34,211,238,0.22)" stroke-width="1"/>
  <text x="640" y="294" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="rgba(255,255,255,0.85)">Follow-up Sequences</text>
  <text x="640" y="310" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">Day 1 · 3 · 7 · 14 · auto</text>
  <line x1="530" y1="280" x2="455" y2="252" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <polygon points="457,248 453,256 461,256" fill="#22d3ee" opacity="0.5"/>

  <!-- Objection handling (bottom) -->
  <rect x="290" y="340" width="220" height="52" rx="10" fill="rgba(249,115,22,0.06)" stroke="rgba(249,115,22,0.22)" stroke-width="1"/>
  <text x="400" y="364" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="rgba(255,255,255,0.85)">Objection Handling</text>
  <text x="400" y="380" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">Price · Timing · Competitor</text>
  <line x1="400" y1="340" x2="400" y2="255" stroke="#f97316" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <polygon points="396,258 400,252 404,258" fill="#f97316" opacity="0.5"/>

  <!-- Appointment booking (bottom-left) -->
  <rect x="50" y="270" width="220" height="52" rx="10" fill="rgba(34,197,94,0.06)" stroke="rgba(34,197,94,0.22)" stroke-width="1"/>
  <text x="160" y="294" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="rgba(255,255,255,0.85)">Appointment Booking</text>
  <text x="160" y="310" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">Direct to rep calendar</text>
  <line x1="270" y1="285" x2="343" y2="248" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <polygon points="341,244 347,252 339,252" fill="#22c55e" opacity="0.5"/>

  <!-- Lead scoring (left) -->
  <rect x="30" y="150" width="200" height="52" rx="10" fill="rgba(99,102,241,0.07)" stroke="rgba(99,102,241,0.22)" stroke-width="1"/>
  <text x="130" y="174" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="rgba(255,255,255,0.85)">Lead Scoring</text>
  <text x="130" y="190" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">0–100 · route hot leads now</text>
  <line x1="230" y1="176" x2="330" y2="204" stroke="#6366f1" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <polygon points="328,199 332,207 324,207" fill="#6366f1" opacity="0.5"/>
</svg>
