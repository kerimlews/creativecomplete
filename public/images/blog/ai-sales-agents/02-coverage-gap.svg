<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="humanbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="aibar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>

  <text x="400" y="38" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#6366f1" letter-spacing="3" opacity="0.7">24/7 COVERAGE — HUMAN VS AI</text>

  <!-- 24-hour timeline -->
  <text x="40" y="80" font-family="ui-monospace,monospace" font-size="9" fill="rgba(255,255,255,0.25)">00:00</text>
  <text x="195" y="80" font-family="ui-monospace,monospace" font-size="9" fill="rgba(255,255,255,0.25)">06:00</text>
  <text x="378" y="80" font-family="ui-monospace,monospace" font-size="9" fill="rgba(255,255,255,0.25)">12:00</text>
  <text x="562" y="80" font-family="ui-monospace,monospace" font-size="9" fill="rgba(255,255,255,0.25)">18:00</text>
  <text x="720" y="80" font-family="ui-monospace,monospace" font-size="9" fill="rgba(255,255,255,0.25)">24:00</text>

  <!-- Hour tick marks -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="40" y1="85" x2="40" y2="300"/>
    <line x1="73" y1="85" x2="73" y2="300"/>
    <line x1="106" y1="85" x2="106" y2="300"/>
    <line x1="139" y1="85" x2="139" y2="300"/>
    <line x1="172" y1="85" x2="172" y2="300"/>
    <line x1="205" y1="85" x2="205" y2="300"/>
    <line x1="238" y1="85" x2="238" y2="300"/>
    <line x1="271" y1="85" x2="271" y2="300"/>
    <line x1="304" y1="85" x2="304" y2="300"/>
    <line x1="337" y1="85" x2="337" y2="300"/>
    <line x1="370" y1="85" x2="370" y2="300"/>
    <line x1="403" y1="85" x2="403" y2="300"/>
    <line x1="436" y1="85" x2="436" y2="300"/>
    <line x1="469" y1="85" x2="469" y2="300"/>
    <line x1="502" y1="85" x2="502" y2="300"/>
    <line x1="535" y1="85" x2="535" y2="300"/>
    <line x1="568" y1="85" x2="568" y2="300"/>
    <line x1="601" y1="85" x2="601" y2="300"/>
    <line x1="634" y1="85" x2="634" y2="300"/>
    <line x1="667" y1="85" x2="667" y2="300"/>
    <line x1="700" y1="85" x2="700" y2="300"/>
    <line x1="733" y1="85" x2="733" y2="300"/>
    <line x1="760" y1="85" x2="760" y2="300"/>
  </g>

  <!-- Human team row -->
  <text x="40" y="112" font-family="ui-monospace,monospace" font-size="10" fill="rgba(255,255,255,0.4)">Human team</text>
  <!-- Off: 00:00–09:00 = x40 to x337 -->
  <rect x="40" y="120" width="297" height="36" rx="4" fill="rgba(239,68,68,0.08)" stroke="rgba(239,68,68,0.15)" stroke-width="1"/>
  <text x="188" y="142" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="rgba(239,68,68,0.5)">OFFLINE · 9 hours</text>
  <!-- On: 09:00–17:00 = x337 to x601 -->
  <rect x="337" y="120" width="264" height="36" rx="4" fill="url(#humanbar)" opacity="0.7"/>
  <text x="469" y="142" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="rgba(255,255,255,0.9)" font-weight="700">ONLINE · 8 hours</text>
  <!-- Off: 17:00–24:00 = x601 to x760 -->
  <rect x="601" y="120" width="159" height="36" rx="4" fill="rgba(239,68,68,0.08)" stroke="rgba(239,68,68,0.15)" stroke-width="1"/>
  <text x="680" y="142" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="rgba(239,68,68,0.5)">OFFLINE · 7h</text>

  <!-- AI Agent row -->
  <text x="40" y="184" font-family="ui-monospace,monospace" font-size="10" fill="#22d3ee">AI Agent</text>
  <!-- On: 00:00–24:00 = full width -->
  <rect x="40" y="192" width="720" height="36" rx="4" fill="url(#aibar)" opacity="0.7"/>
  <text x="400" y="214" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="rgba(0,0,0,0.8)" font-weight="700">ALWAYS ON · 24 hours · 365 days · &lt;60s response</text>

  <!-- Coverage stat -->
  <rect x="40" y="248" width="340" height="60" rx="12" fill="rgba(239,68,68,0.06)" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
  <text x="210" y="274" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="rgba(239,68,68,0.7)" letter-spacing="2">WITHOUT AI</text>
  <text x="210" y="296" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="18" font-weight="800" fill="#f87171">128 hours/week uncovered</text>

  <rect x="420" y="248" width="340" height="60" rx="12" fill="rgba(34,211,238,0.06)" stroke="rgba(34,211,238,0.2)" stroke-width="1"/>
  <text x="590" y="274" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#22d3ee" letter-spacing="2">WITH AI AGENT</text>
  <text x="590" y="296" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="18" font-weight="800" fill="#67e8f9">168 hours/week covered</text>

  <text x="400" y="348" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" fill="rgba(255,255,255,0.2)">A lead contacted within 5 minutes is 21× more likely to qualify than one contacted 24 hours later</text>

  <text x="400" y="396" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="rgba(255,255,255,0.15)">After-hours leads are qualified and waiting in queue — ready for your team Monday morning</text>
</svg>
