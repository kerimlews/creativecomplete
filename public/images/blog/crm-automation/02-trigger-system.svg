  <rect x="24" y="318" width="752" height="52" rx="8" fill="rgba(34,197,94,0.05)" stroke="rgba(34,197,94,0.12)" stroke-width="1"/>
  <rect x="34" y="328" width="172" height="32" rx="6" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.25)" stroke-width="1"/>
  <text x="120" y="348" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#4ade80">Meeting completed</text>
  <text x="400" y="348" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="rgba(255,255,255,0.4)">calendar event ends</text>
  <rect x="556" y="328" width="208" height="32" rx="6" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.25)" stroke-width="1"/>
  <text x="660" y="348" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#4ade80">Log activity + next step</text>

