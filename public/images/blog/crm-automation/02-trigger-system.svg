    <text x="407" y="168" font-family="ui-monospace,monospace" font-size="9" fill="rgba(255,255,255,0.18)">THEN</text>
    <polygon points="213,224 236,217 236,231"/>
    <text x="250" y="228" font-family="ui-monospace,monospace" font-size="9" fill="rgba(255,255,255,0.18)">IF</text>
    <polygon points="370,224 393,217 393,231"/>
    <text x="407" y="228" font-family="ui-monospace,monospace" font-size="9" fill="rgba(255,255,255,0.18)">THEN</text>
    <polygon points="213,284 236,277 236,291"/>
    <text x="250" y="288" font-family="ui-monospace,monospace" font-size="9" fill="rgba(255,255,255,0.18)">IF</text>
    <polygon points="370,284 393,277 393,291"/>
    <text x="407" y="288" font-family="ui-monospace,monospace" font-size="9" fill="rgba(255,255,255,0.18)">THEN</text>
    <polygon points="213,344 236,337 236,351"/>
    <text x="250" y="348" font-family="ui-monospace,monospace" font-size="9" fill="rgba(255,255,255,0.18)">IF</text>
    <polygon points="370,344 393,337 393,351"/>
    <text x="407" y="348" font-family="ui-monospace,monospace" font-size="9" fill="rgba(255,255,255,0.18)">THEN</text>
  </g>

  <text x="400" y="398" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="rgba(255,255,255,0.18)">Every trigger runs automatically — the CRM pipeline reflects reality without manual updates</text>
