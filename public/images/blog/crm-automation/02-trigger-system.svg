  <rect x="34" y="268" width="172" height="32" rx="6" fill="rgba(239,68,68,0.08)" stroke="rgba(239,68,68,0.2)" stroke-width="1"/>
  <text x="120" y="288" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#f87171">7 days no contact</text>
  <text x="400" y="288" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="rgba(255,255,255,0.4)">any active deal</text>
  <rect x="556" y="268" width="208" height="32" rx="6" fill="rgba(168,85,247,0.08)" stroke="rgba(168,85,247,0.2)" stroke-width="1"/>
