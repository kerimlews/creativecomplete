  <rect x="556" y="88" width="208" height="32" rx="6" fill="rgba(34,211,238,0.08)" stroke="rgba(34,211,238,0.25)" stroke-width="1"/>
  <text x="660" y="108" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#22d3ee">Create contact + enrich</text>

  <!-- Row 2 -->
  <rect x="24" y="138" width="752" height="52" rx="8" fill="rgba(168,85,247,0.05)" stroke="rgba(168,85,247,0.15)" stroke-width="1"/>
  <rect x="34" y="148" width="172" height="32" rx="6" fill="rgba(168,85,247,0.1)" stroke="rgba(168,85,247,0.25)" stroke-width="1"/>
