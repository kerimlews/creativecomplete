  <text x="660" y="66" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="rgba(255,255,255,0.3)" letter-spacing="2">AUTOMATED ACTION</text>

  <!-- Row 1 -->
  <rect x="24" y="78" width="752" height="52" rx="8" fill="rgba(99,102,241,0.06)" stroke="rgba(99,102,241,0.18)" stroke-width="1"/>
