  <rect x="24" y="198" width="752" height="52" rx="8" fill="rgba(249,115,22,0.05)" stroke="rgba(249,115,22,0.15)" stroke-width="1"/>
  <rect x="34" y="208" width="172" height="32" rx="6" fill="rgba(249,115,22,0.1)" stroke="rgba(249,115,22,0.25)" stroke-width="1"/>
  <text x="120" y="228" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#fb923c">3 days no contact</text>
  <text x="400" y="228" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="rgba(255,255,255,0.4)">deal in Qualified stage</text>
  <rect x="556" y="208" width="208" height="32" rx="6" fill="rgba(249,115,22,0.08)" stroke="rgba(249,115,22,0.25)" stroke-width="1"/>
  <text x="660" y="228" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#fb923c">Rep follow-up task</text>

