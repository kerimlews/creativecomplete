  <rect x="34" y="88" width="172" height="32" rx="6" fill="rgba(99,102,241,0.12)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
  <text x="120" y="108" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#818cf8">Lead submits form</text>
  <!-- Condition -->
  <text x="400" y="108" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="rgba(255,255,255,0.4)">always</text>
