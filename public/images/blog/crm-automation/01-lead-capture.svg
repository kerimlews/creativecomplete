<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <radialGradient id="crmglow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>

  <text x="400" y="38" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#6366f1" letter-spacing="3" opacity="0.7">AUTOMATED CRM LEAD CAPTURE</text>

  <!-- CRM in center -->
  <ellipse cx="400" cy="215" rx="100" ry="60" fill="url(#crmglow)"/>
  <rect x="330" y="180" width="140" height="70" rx="14" fill="rgba(99,102,241,0.12)" stroke="rgba(99,102,241,0.5)" stroke-width="2"/>
  <text x="400" y="210" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#818cf8" letter-spacing="2">CRM</text>
  <text x="400" y="232" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#e0e7ff">Auto-Captured</text>
  <text x="400" y="247" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="rgba(255,255,255,0.3)">enriched · scored · ranked</text>

  <!-- Channels feeding in -->
  <!-- WhatsApp (top-left) -->
  <rect x="24" y="50" width="130" height="54" rx="10" fill="rgba(37,209,102,0.08)" stroke="rgba(37,209,102,0.3)" stroke-width="1"/>
  <text x="89" y="74" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#25d166" font-weight="700">WhatsApp</text>
  <text x="89" y="91" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">DMs · Broadcasts</text>
  <line x1="154" y1="100" x2="330" y2="200" stroke="#25d166" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <polygon points="328,196 334,204 322,204" fill="#25d166" opacity="0.5"/>

  <!-- Instagram (top) -->
  <rect x="270" y="30" width="130" height="54" rx="10" fill="rgba(168,85,247,0.08)" stroke="rgba(168,85,247,0.3)" stroke-width="1"/>
  <text x="335" y="54" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#a855f7" font-weight="700">Instagram</text>
  <text x="335" y="71" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">DMs · Story replies</text>
  <line x1="335" y1="84" x2="370" y2="180" stroke="#a855f7" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <polygon points="368,177 374,185 362,183" fill="#a855f7" opacity="0.5"/>

  <!-- Facebook Ads (top-right) -->
  <rect x="520" y="30" width="130" height="54" rx="10" fill="rgba(99,102,241,0.08)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
  <text x="585" y="54" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#818cf8" font-weight="700">Facebook Ads</text>
  <text x="585" y="71" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">Lead forms</text>
  <line x1="520" y1="80" x2="440" y2="180" stroke="#818cf8" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <polygon points="442,177 436,185 448,183" fill="#818cf8" opacity="0.5"/>

  <!-- Website (right) -->
  <rect x="646" y="160" width="130" height="54" rx="10" fill="rgba(34,211,238,0.07)" stroke="rgba(34,211,238,0.25)" stroke-width="1"/>
  <text x="711" y="184" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#22d3ee" font-weight="700">Website</text>
  <text x="711" y="201" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">Forms · Chat</text>
  <line x1="646" y1="187" x2="470" y2="210" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <polygon points="472,207 468,215 476,215" fill="#22d3ee" opacity="0.5"/>

  <!-- Email (bottom-right) -->
  <rect x="646" y="280" width="130" height="54" rx="10" fill="rgba(249,115,22,0.07)" stroke="rgba(249,115,22,0.25)" stroke-width="1"/>
  <text x="711" y="304" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#f97316" font-weight="700">Email</text>
  <text x="711" y="321" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">Reply detection</text>
  <line x1="646" y1="307" x2="470" y2="240" stroke="#f97316" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <polygon points="472,238 468,246 476,244" fill="#f97316" opacity="0.5"/>

  <!-- Offline (bottom-left) -->
  <rect x="24" y="300" width="130" height="54" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="89" y="324" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="rgba(255,255,255,0.4)" font-weight="700">Offline</text>
  <text x="89" y="341" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.3)">QR · Referrals</text>
  <line x1="154" y1="310" x2="330" y2="245" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <polygon points="332,247 326,253 324,241" fill="rgba(255,255,255,0.3)" opacity="0.5"/>

  <!-- Result strip -->
  <rect x="80" y="365" width="640" height="36" rx="10" fill="rgba(99,102,241,0.06)" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>
  <text x="400" y="384" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.55)">Every lead captured automatically · enriched with company data · scored · ranked by priority</text>
  <text x="400" y="399" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="rgba(255,255,255,0.25)">Zero manual data entry · Zero missed leads</text>
</svg>
