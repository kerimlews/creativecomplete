<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#070d1f"/>
    </linearGradient>
    <linearGradient id="timelineg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="40%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="44" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#a855f7" letter-spacing="3" opacity="0.7">AI FIRST RESPONSE TIMELINE</text>

  <!-- Timeline line -->
  <rect x="80" y="190" width="640" height="2" rx="1" fill="url(#timelineg)" opacity="0.5"/>

  <!-- Time markers -->
  <!-- T=0: Lead submits -->
  <circle cx="80" cy="191" r="8" fill="#6366f1" stroke="#818cf8" stroke-width="2"/>
  <text x="80" y="175" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#818cf8">0s</text>
  <line x1="80" y1="199" x2="80" y2="260" stroke="#6366f1" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <rect x="20" y="260" width="120" height="50" rx="8" fill="rgba(99,102,241,0.08)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
  <text x="80" y="278" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.8)">Lead submits</text>
  <text x="80" y="294" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.35)">form / DM / ad click</text>

  <!-- T=5: AI detects -->
  <circle cx="240" cy="191" r="6" fill="#8b5cf6" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="240" y="175" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#a78bfa">5s</text>
  <line x1="240" y1="183" x2="240" y2="140" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <rect x="180" y="108" width="120" height="32" rx="7" fill="rgba(139,92,246,0.1)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
  <text x="240" y="128" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#c4b5fd">AI Agent activated</text>

  <!-- T=12: First message -->
  <circle cx="370" cy="191" r="10" fill="#a855f7" stroke="#d8b4fe" stroke-width="2.5"/>
  <text x="370" y="171" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#d8b4fe" font-weight="700">12s</text>
  <line x1="370" y1="201" x2="370" y2="270" stroke="#a855f7" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <rect x="290" y="270" width="160" height="60" rx="8" fill="rgba(168,85,247,0.1)" stroke="rgba(168,85,247,0.4)" stroke-width="1"/>
  <text x="370" y="290" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#d8b4fe">First message sent</text>
  <text x="370" y="306" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.45)">Personalized to lead</text>
  <text x="370" y="320" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.45)">source and need</text>

  <!-- T=47: Qualification done -->
  <circle cx="560" cy="191" r="8" fill="#06b6d4" stroke="#22d3ee" stroke-width="2"/>
  <text x="560" y="175" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#22d3ee">47s</text>
  <line x1="560" y1="183" x2="560" y2="140" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <rect x="490" y="108" width="140" height="32" rx="7" fill="rgba(34,211,238,0.08)" stroke="rgba(34,211,238,0.25)" stroke-width="1"/>
  <text x="560" y="128" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#67e8f9">BANT qualification complete</text>

  <!-- T=60: Rep notified -->
  <circle cx="720" cy="191" r="10" fill="#22d3ee" stroke="#67e8f9" stroke-width="2.5"/>
  <text x="720" y="171" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#67e8f9" font-weight="700">60s</text>
  <line x1="720" y1="201" x2="720" y2="270" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <rect x="640" y="270" width="140" height="60" rx="8" fill="rgba(34,211,238,0.08)" stroke="rgba(34,211,238,0.3)" stroke-width="1"/>
  <text x="710" y="290" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#cffafe">Rep notified</text>
  <text x="710" y="307" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.45)">with full BANT</text>
  <text x="710" y="322" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="rgba(255,255,255,0.45)">summary</text>

  <!-- VS traditional -->
  <rect x="280" y="370" width="240" height="28" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="400" y="389" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="rgba(255,255,255,0.25)">Traditional approach: 2–47 hours</text>
</svg>
