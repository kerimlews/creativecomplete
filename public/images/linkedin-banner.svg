<svg width="1584" height="396" viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0d0f1f"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="line-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="url(#bg)"/>
  <rect width="1584" height="396" fill="url(#glow1)"/>
  <rect width="1584" height="396" fill="url(#glow2)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="99" x2="1584" y2="99" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0" y1="198" x2="1584" y2="198" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0" y1="297" x2="1584" y2="297" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="264" y1="0" x2="264" y2="396" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="528" y1="0" x2="528" y2="396" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="792" y1="0" x2="792" y2="396" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="1056" y1="0" x2="1056" y2="396" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="1320" y1="0" x2="1320" y2="396" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>

  <!-- Accent bar top -->
  <rect x="0" y="0" width="1584" height="3" fill="url(#line-grad)"/>

  <!-- Left block: Company + role -->
  <text x="80" y="148" font-family="ui-monospace,monospace" font-size="11" letter-spacing="0.22em" fill="rgba(99,102,241,0.8)" font-weight="600">CREATIVECOMPLETE</text>
  <text x="80" y="210" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif" font-size="54" font-weight="700" letter-spacing="-0.03em" fill="rgba(255,255,255,0.95)">AI Customer</text>
  <text x="80" y="272" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif" font-size="54" font-weight="700" letter-spacing="-0.03em">
    <tspan fill="url(#grad-text)">System</tspan>
    <tspan fill="rgba(255,255,255,0.95)"> Agency</tspan>
  </text>

  <!-- Divider -->
  <rect x="80" y="300" width="320" height="1.5" fill="url(#line-grad)" opacity="0.5"/>

  <!-- Tagline -->
  <text x="80" y="336" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif" font-size="16" fill="rgba(255,255,255,0.4)" letter-spacing="-0.01em">Qualify leads in 60 s · Close more · Add zero headcount</text>

  <!-- Right block: stat cards -->
  <!-- Card 1 -->
  <rect x="860" y="80" width="180" height="100" rx="14" fill="rgba(99,102,241,0.08)" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>
  <text x="950" y="136" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif" font-size="40" font-weight="800" letter-spacing="-0.03em" fill="url(#grad-text)">42.5×</text>
  <text x="950" y="160" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.35)" letter-spacing="-0.01em">Broadcast ROI</text>

  <!-- Card 2 -->
  <rect x="1060" y="80" width="180" height="100" rx="14" fill="rgba(99,102,241,0.08)" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>
  <text x="1150" y="136" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif" font-size="40" font-weight="800" letter-spacing="-0.03em" fill="url(#grad-text)">200%</text>
  <text x="1150" y="160" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.35)" letter-spacing="-0.01em">More customers</text>

  <!-- Card 3 -->
  <rect x="1260" y="80" width="180" height="100" rx="14" fill="rgba(99,102,241,0.08)" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>
  <text x="1350" y="136" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif" font-size="40" font-weight="800" letter-spacing="-0.03em" fill="url(#grad-text)">14×</text>
  <text x="1350" y="160" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.35)" letter-spacing="-0.01em">More ad conversions</text>

  <!-- Card 4 -->
  <rect x="860" y="200" width="180" height="100" rx="14" fill="rgba(99,102,241,0.08)" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>
  <text x="950" y="256" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif" font-size="40" font-weight="800" letter-spacing="-0.03em" fill="url(#grad-text)">10</text>
  <text x="950" y="280" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.35)" letter-spacing="-0.01em">Days to go live</text>

  <!-- Card 5 -->
  <rect x="1060" y="200" width="180" height="100" rx="14" fill="rgba(99,102,241,0.08)" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>
  <text x="1150" y="256" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif" font-size="40" font-weight="800" letter-spacing="-0.03em" fill="url(#grad-text)">81%</text>
  <text x="1150" y="280" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.35)" letter-spacing="-0.01em">Lead conversion rate</text>

  <!-- Card 6 -->
  <rect x="1260" y="200" width="180" height="100" rx="14" fill="rgba(99,102,241,0.08)" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>
  <text x="1350" y="256" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif" font-size="40" font-weight="800" letter-spacing="-0.03em" fill="url(#grad-text)">93%</text>
  <text x="1350" y="280" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.35)" letter-spacing="-0.01em">CSAT score</text>

  <!-- URL bottom right -->
  <text x="1504" y="370" text-anchor="end" font-family="ui-monospace,monospace" font-size="11" fill="rgba(255,255,255,0.2)" letter-spacing="0.06em">creativecomplete.co</text>
